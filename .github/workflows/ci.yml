name: Pricing CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          find app config database public routes views tests -name '*.php' -print0 | xargs -0 -n1 php -l > CI_LINT_REPORT.txt 2>&1
          code=$?
          cat CI_LINT_REPORT.txt
          echo "exit_code=$code" >> CI_LINT_REPORT.txt
          exit $code
      - name: Commit lint report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CI_LINT_REPORT.txt
          git commit -m "CI: capture lint report" || true
          git push || true
      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
