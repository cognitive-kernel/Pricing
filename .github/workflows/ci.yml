name: Pricing CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP version
        run: php -v
      - name: PHP lint
        run: |
          find app config database public routes views tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Static smoke test
        run: php tests/static_smoke.php
